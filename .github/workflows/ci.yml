# CI for The First Hospitality Group (blueprint section 9.3 and 15).
# Jobs skip cleanly until package.json exists (Sprint 0 creates it).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect app
        id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci
      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - name: No money in the data model (ADR 0018)
        run: node scripts/no-money-check.mjs
      - name: Generated Convex API and preview registry are current (ADR 0028)
        if: steps.app.outputs.present == 'true'
        run: node scripts/gen-convex-api.mjs && git diff --exit-code convex/_generated/api.d.ts lib/demo/registry.ts
      - name: Unit and backend tests with coverage (domain >= 90 %, role x venue matrix on the real handlers, tokens and copy guards)
        if: steps.app.outputs.present == 'true'
        run: npm run test -- --coverage
      - name: Build (preview mode)
        if: steps.app.outputs.present == 'true'
        run: npm run build
      - name: JS budgets (blueprint 6.6)
        if: steps.app.outputs.present == 'true'
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000
          node scripts/measure-budgets.mjs
      - name: Dependency audit
        if: steps.app.outputs.present == 'true'
        run: npm audit --audit-level=high --omit=dev

  convex:
    runs-on: ubuntu-latest
    needs: quality
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CONVEX_DEPLOY_KEY != ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm ci
      - name: Codegen and typecheck against the deployment
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npx convex codegen --typecheck enable
      - name: Deploy functions (main only)
        if: env.CONVEX_DEPLOY_KEY != '' && github.ref == 'refs/heads/main'
        run: npx convex deploy

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci && npx playwright install --with-deps chromium webkit
      - name: Playwright (Pixel 7, iPhone SE, desktop 1440; EN and ES; axe)
        if: steps.app.outputs.present == 'true'
        run: npm run test:e2e
      - name: Lighthouse CI on / and /login
        if: steps.app.outputs.present == 'true'
        run: npx @lhci/cli autorun
