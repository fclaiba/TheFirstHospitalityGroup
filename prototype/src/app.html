<title>The First</title>
<meta name="theme-color" content="#ffffff">
<style>
/*FONTS*/
/* Layout: phone-first app shell; on wide screens a phone frame with a demo panel beside it.
   Tokens mirror docs/brand/tokens.css. */
:root {
  --canvas: #ffffff; --surface: #f6f7f3; --raised: #ffffff; --line: #e3e6dc; --line-strong: #858a7f;
  --ink: #111311; --ink-muted: #5e625b; --ink-subtle: #6b6f68; --on-ink: #ffffff;
  --olive-50: #eef2e8; --olive-100: #e3ebdb; --olive-200: #c8d6ba; --olive-300: #9db88a;
  --brand: #4a6b3e; --brand-pressed: #36522f; --on-brand: #ffffff; --focus: #2f5b8f;
  --ok-fg: #1f5f46; --ok-bg: #e3f1ea; --info-fg: #2f5b8f; --info-bg: #e5edf6;
  --att-fg: #7a4a04; --att-bg: #fef3c7; --fol-fg: #9a3b0b; --fol-bg: #fde8d7;
  --rev-fg: #912018; --rev-bg: #fee4e2; --danger: #b42318;
  --stage: #e9ebe4; --stage-ink: #111311; --stage-muted: #5e625b;
  --sans: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --scale: 1;
  --t-cap: calc(13px * var(--scale)); --t-small: calc(15px * var(--scale)); --t-body: calc(17px * var(--scale));
  --t-lead: calc(19px * var(--scale)); --t-title: calc(26px * var(--scale)); --t-fig: calc(34px * var(--scale));
  --r-check: 6px; --r-input: 10px; --r-ctl: 12px; --r-card: 16px; --r-sheet: 24px;
  --shadow-card: 0 1px 2px rgba(17,19,17,.06), 0 4px 12px rgba(17,19,17,.05);
  --shadow-sheet: 0 -8px 32px rgba(17,19,17,.12);
  --fast: 120ms; --slow: 320ms; --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0f110e; --surface: #171a15; --raised: #1d211b; --line: #2a2f26; --line-strong: #636a5d;
    --ink: #f2f3ee; --ink-muted: #b6bbae; --ink-subtle: #a2a79a; --on-ink: #111311;
    --olive-50: #1b2418; --olive-100: #24301f; --brand: #9db88a; --brand-pressed: #c8d6ba; --on-brand: #111311; --focus: #8fb4e3;
    --ok-fg: #8fd1b3; --ok-bg: #16281f; --info-fg: #9dbfe6; --info-bg: #15202d; --att-fg: #f5cf6b; --att-bg: #2b2208;
    --fol-fg: #f6a774; --fol-bg: #2e1709; --rev-fg: #f69c94; --rev-bg: #301110; --danger: #f69c94;
    --stage: #e9ebe4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0f110e; --surface: #171a15; --raised: #1d211b; --line: #2a2f26; --line-strong: #636a5d;
  --ink: #f2f3ee; --ink-muted: #b6bbae; --ink-subtle: #a2a79a; --on-ink: #111311;
  --olive-50: #1b2418; --olive-100: #24301f; --brand: #9db88a; --brand-pressed: #c8d6ba; --on-brand: #111311; --focus: #8fb4e3;
  --ok-fg: #8fd1b3; --ok-bg: #16281f; --info-fg: #9dbfe6; --info-bg: #15202d; --att-fg: #f5cf6b; --att-bg: #2b2208;
  --fol-fg: #f6a774; --fol-bg: #2e1709; --rev-fg: #f69c94; --rev-bg: #301110; --danger: #f69c94;
  --stage: #e9ebe4; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--sans); font-size: var(--t-body); line-height: 1.5; }
button, a, [role="button"], .tap { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; font-size: max(16px, var(--t-body)); color: var(--ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }

/* Stage */
.stage { min-height: 100dvh; display: flex; gap: 40px; align-items: center; justify-content: center; padding-block: 24px; padding-inline: 16px; }
.panel { width: 320px; color: var(--stage-ink); display: flex; flex-direction: column; gap: 22px; }
.panel .brand { display: flex; align-items: center; gap: 14px; }
.panel .brand svg { width: 56px; height: 56px; }
.panel .brand b { display: block; font-size: 17px; letter-spacing: .16em; font-weight: 600; }
.panel .brand span { font-size: 11px; letter-spacing: .3em; color: #4a6b3e; font-weight: 500; }
.panel h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--stage-muted); text-transform: uppercase; margin-bottom: 8px; }
.panel p { font-size: 15px; color: var(--stage-muted); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.panel .brand b { color: #111311; }
.roles button { border: 1px solid #c8cdbd; background: #ffffff; border-radius: var(--r-ctl); padding: 12px; text-align: left; min-height: 56px; color: var(--stage-ink); }
.roles button small { display: block; color: var(--stage-muted); font-size: 12px; }
.roles button[aria-pressed="true"] { background: #4a6b3e; border-color: #4a6b3e; color: #ffffff; }
.roles button[aria-pressed="true"] small { color: #e3ebdb; }
.panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
.chipbtn { border: 1px solid #c8cdbd; background: #ffffff; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--stage-ink); min-height: 40px; }
.chipbtn[aria-pressed="true"] { background: #111311; color: #ffffff; border-color: #111311; }
.demo-note { font-size: 13px; color: var(--stage-muted); border-top: 1px solid #d5d9cd; padding-top: 14px; }
.phone { width: 400px; height: min(860px, calc(100dvh - 48px)); border-radius: 48px; background: #2b2f2a; padding: 10px; box-shadow: 0 30px 60px rgba(17,19,17,.18); flex: none; }
.app { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--canvas); display: flex; flex-direction: column; position: relative; }
@media (max-width: 860px) {
  .stage { padding: 0; display: block; }
  .panel { display: none; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
  .app { border-radius: 0; }
  .mobile-demo { display: flex !important; }
}

/* App chrome */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.topbar .mark { width: 34px; height: 34px; flex: none; }
.topbar .who { text-align: right; font-size: var(--t-cap); line-height: 1.3; min-width: 0; }
.topbar .who b { display: block; font-size: var(--t-small); font-weight: 600; }
.topbar .who span { color: var(--ink-muted); }
.mobile-demo { display: none; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.mobile-demo button { border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; min-height: 36px; }
.mobile-demo button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 18px 96px; display: flex; flex-direction: column; gap: 18px; }
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--canvas); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: var(--ink-muted); position: relative; border-radius: 10px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--brand); }
.tabs .dot { position: absolute; top: 8px; left: calc(50% + 8px); width: 10px; height: 10px; border-radius: 5px; background: var(--danger); box-shadow: 0 0 0 2px var(--canvas); }

/* Type */
.h1 { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; }
.h2 { font-size: var(--t-lead); font-weight: 700; }
.muted { color: var(--ink-muted); }
.small { font-size: var(--t-small); }
.cap { font-size: var(--t-cap); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: var(--t-cap); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }

/* Controls */
.btn { min-height: 56px; border-radius: var(--r-ctl); padding: 0 20px; font-weight: 600; font-size: var(--t-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform var(--fast) var(--ease), background var(--fast); width: 100%; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:active { background: var(--brand-pressed); }
.btn.secondary { border: 1.5px solid var(--ink); color: var(--ink); }
.btn.quiet { min-height: 48px; color: var(--brand); width: auto; padding: 0 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--t-small); font-weight: 600; }
.field input, .field textarea, .field select { min-height: 52px; border: 1.5px solid var(--line-strong); border-radius: var(--r-input); background: var(--canvas); padding: 12px 14px; width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.field .hint { font-size: var(--t-cap); color: var(--ink-muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { min-height: 48px; font-weight: 600; font-size: var(--t-small); border-left: 1.5px solid var(--line-strong); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.search { min-height: 52px; border: 1.5px solid var(--line-strong); border-radius: var(--r-input); padding: 12px 14px 12px 44px; width: 100%; background: var(--canvas) no-repeat 14px center; }
.searchwrap { position: relative; }
.searchwrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-muted); }
.pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pill { border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 0 16px; min-height: 44px; font-weight: 600; font-size: var(--t-small); white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

/* Cards */
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.lift { box-shadow: var(--shadow-card); border-color: transparent; }
.card.brand { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.card.brand .muted { color: var(--olive-100); }
:root[data-theme="dark"] .card.brand .muted { color: #2e3618; }
.group { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item .grow { flex: 1; min-width: 0; }
.chev { width: 20px; height: 20px; color: var(--ink-subtle); flex: none; }

/* Progress and checklist */
.prog { height: 10px; border-radius: 999px; background: var(--olive-100); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width var(--slow) var(--ease); }
.check { width: 30px; height: 30px; border-radius: var(--r-check); border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; transition: background var(--fast), border-color var(--fast); }
.check svg { width: 18px; height: 18px; color: var(--on-brand); opacity: 0; transform: scale(.6); transition: opacity var(--fast), transform var(--fast) var(--ease); }
.done .check { background: var(--brand); border-color: var(--brand); }
.done .check svg { opacity: 1; transform: scale(1); }
.done .task-label { color: var(--ink-muted); }
.badge { font-size: var(--t-cap); font-weight: 600; border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.badge svg { width: 14px; height: 14px; }
.b-info { background: var(--info-bg); color: var(--info-fg); }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); }
.b-att { background: var(--att-bg); color: var(--att-fg); }
.b-fol { background: var(--fol-bg); color: var(--fol-fg); }
.b-rev { background: var(--rev-bg); color: var(--rev-fg); }
.b-neutral { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

/* Menu */
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dish { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.photo { aspect-ratio: 4 / 3; border-radius: 12px; background: var(--olive-50); display: grid; place-items: center; overflow: hidden; max-width: 100%; position: relative; }
.photo .plate { width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #ffffff 0 52%, #eceee6 53% 66%, #ffffff 67%); box-shadow: 0 6px 14px rgba(17,19,17,.12); display: grid; place-items: center; }
.photo .food { width: 46%; aspect-ratio: 1.4; border-radius: 48% 52% 44% 56%; transform: rotate(-12deg); }
.photo .glass { width: 34%; aspect-ratio: .6; border-radius: 8px 8px 40% 40%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
.photo .tagline { position: absolute; left: 8px; bottom: 8px; font-size: 11px; background: rgba(17,19,17,.62); color: #fff; padding: 2px 8px; border-radius: 6px; }
.dish b { font-size: var(--t-small); line-height: 1.3; }
.unavailable .photo { filter: grayscale(1); opacity: .6; }
.allergens { display: flex; gap: 6px; flex-wrap: wrap; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(17,19,17,.4); display: flex; align-items: flex-end; z-index: 20; animation: fade var(--fast) var(--ease); }
.sheet { background: var(--raised); width: 100%; max-height: 88%; overflow-y: auto; border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 14px; animation: rise var(--slow) var(--ease); overscroll-behavior: contain; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); align-self: center; margin-bottom: 4px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 92px; background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 14px 16px; font-weight: 600; font-size: var(--t-small); z-index: 30; animation: rise var(--slow) var(--ease); }
@keyframes rise { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Counts */
.count { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.stepper button { width: 52px; height: 52px; font-size: 24px; font-weight: 600; display: grid; place-items: center; }
.stepper output { min-width: 64px; text-align: center; font-family: var(--mono); font-size: var(--t-lead); font-variant-numeric: tabular-nums; }

/* KPI */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-family: var(--mono); font-size: var(--t-lead); font-variant-numeric: tabular-nums; font-weight: 600; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--t-small); }
.kv b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.flag b { color: var(--rev-fg); }
.person { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; min-height: 60px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--olive-100); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
:root[data-theme="dark"] .avatar { color: var(--olive-300); }
.mini { height: 6px; border-radius: 3px; background: var(--olive-100); overflow: hidden; margin-top: 6px; }
.mini i { display: block; height: 100%; background: var(--brand); }
.empty { text-align: center; padding: 28px 12px; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg { width: 36px; height: 36px; color: var(--olive-300); }
.venue { text-align: left; }
.locked { background: var(--surface); border-radius: var(--r-card); padding: 18px; display: flex; gap: 12px; align-items: flex-start; }
.locked svg { width: 24px; height: 24px; flex: none; color: var(--ink-muted); }
.fab { position: absolute; right: 16px; bottom: 84px; height: 56px; padding: 0 20px; border-radius: 28px; background: var(--brand); color: var(--on-brand); font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(17,19,17,.22); z-index: 10; }
.fab svg { width: 22px; height: 22px; }
.fab:active { background: var(--brand-pressed); transform: scale(.98); }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kind { border: 1.5px solid var(--line-strong); border-radius: var(--r-card); min-height: 76px; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; font-weight: 600; }
.kind svg { width: 24px; height: 24px; }
.kind[aria-pressed="true"] { border-color: var(--brand); background: var(--olive-50); box-shadow: inset 0 0 0 1.5px var(--brand); }
.kind.help { grid-column: span 2; border-color: var(--rev-fg); color: var(--rev-fg); flex-direction: row; align-items: center; min-height: 60px; gap: 10px; justify-content: flex-start; }
.kind.help[aria-pressed="true"] { background: var(--rev-bg); box-shadow: inset 0 0 0 1.5px var(--rev-fg); }
.tables { display: flex; gap: 8px; flex-wrap: wrap; }
.tbl { min-width: 52px; min-height: 48px; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); font-family: var(--mono); font-weight: 600; }
.tbl[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.req { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.req .actions { display: flex; gap: 8px; }
.req .actions .btn { min-height: 48px; }
.btn.deny { border: 1.5px solid var(--danger); color: var(--danger); }
.toggle { width: 56px; height: 32px; border-radius: 16px; background: var(--line-strong); position: relative; flex: none; transition: background var(--fast); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform var(--fast) var(--ease); }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }
.lvl { font-family: var(--mono); font-weight: 600; font-size: 12px; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.day { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-card); }
.day .grow { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.day .dname { width: 64px; flex: none; font-weight: 700; font-size: var(--t-small); }
.day.is-today { border-color: var(--brand); box-shadow: inset 4px 0 0 var(--brand); }
.day.is-off { background: var(--surface); border-color: transparent; }
.day .block { font-weight: 600; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sec { border: 1.5px solid var(--line); border-radius: var(--r-card); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec.mine { border-color: var(--brand); background: var(--olive-50); }
.tbls { display: flex; flex-wrap: wrap; gap: 6px; }
.tb { min-width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: var(--canvas); }
.tb b { font-family: var(--mono); font-size: 13px; }
.tb i { font-style: normal; font-size: 10px; color: var(--ink-muted); margin-top: 2px; }
.tb.flag { border-color: var(--rev-fg); box-shadow: inset 0 0 0 1.5px var(--rev-fg); }
button.badge { border: 0; cursor: pointer; min-height: 32px; }
.chain { display: flex; flex-direction: column; gap: 10px; }
.area { border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; }
.area .label { color: var(--brand); }

    <div><p class="label">${t("liveSideWork")}</p>${team.map(({ p, pr }) => `<div class="person"><span class="avatar">${p.initials}</span><span><b class="small">${esc(p.name)}</b> <span class="cap muted">${pick(POS[p.pos])}</span><div class="mini"><i style="width:${pr.pct}%"></i></div></span>${pr.d === pr.n ? `<span class="badge b-ok">${ICON.check}${t("done")}</span>` : pr.pct < 40 && state.shift === "open" ? `<span class="badge b-att">${t("behind")}</span>` : `<span class="badge b-info">${t("onTime")}</span>`}</div>`).join("")}</div>`;
}
function screenScheduleManage() {
  const ev = state.events[0]; const isOwner = state.role === "director";
  return `<h1 class="h1">${t("schedule")}</h1><p class="small muted">${t("week")} · v${state.published2 ? 2 : 1}</p>
    ${isOwner ? `<button class="btn primary" data-sheet="event">${t("newEvent")}</button>` : ""}
    ${state.events.map(e => `<div class="card"><div class="row between"><span class="label">${t("event")} · ${pick(DAYS[e.day])} · ${e.time}</span></div><p class="h2">${esc(pick(e.name))}</p>
      <span class="label" style="margin-top:4px">${t("coverage")}</span>${Object.entries(e.need).map(([pos, [req, fill]]) => `<div class="kv"><span>${pick(POS[pos])}</span>${fill < req ? `<span class="badge b-att">${t("missing")}</span>` : `<span class="badge b-ok">${ICON.check}${t("complete")}</span>`}</div>`).join("")}</div>`).join("")}
    ${!isOwner ? `<div class="card"><span class="label">${t("confirmations")}</span>${state.unconfirmed.length ? "" : `<span class="badge b-ok">${ICON.check}${t("allConfirmed")}</span>`}
      ${state.unconfirmed.length ? `<p class="small"><b>${t("notConfirmed")}:</b> ${state.unconfirmed.map(esc).join(", ")}</p><button class="btn secondary" data-remind>${t("remind")}</button>` : ""}</div>
    <div class="card"><span class="label">${t("swapsToApprove")}</span>${state.approvals.map(a => `<div class="req"><b class="small">${esc(pick(a.text))}</b>${a.status === "open" ? `<div class="actions"><button class="btn primary" data-approve="${a.id}" data-v="approved">${t("approve")}</button><button class="btn deny" data-approve="${a.id}" data-v="denied">${t("deny")}</button></div>` : `<span class="badge ${a.status === "approved" ? "b-ok" : "b-rev"}">${t(a.status)}</span>`}</div>`).join("")}</div>
    <button class="btn primary" data-publish ${state.published2 ? "disabled" : ""}>${t("publish")}</button>` : ""}`;
}
function sheetEvent() {
  return `<div class="grab"></div><h2 class="h1" style="font-size:var(--t-lead)">${t("newEvent")}</h2>
    <div class="field"><label for="ev-name">${t("eventName")}</label><input id="ev-name" value="${state.lang === "es" ? "Degustación de vinos" : "Wine tasting"}"></div>
    <div class="field"><label for="ev-day">${t("date")}</label><select id="ev-day">${DAYS.map((d, i) => `<option value="${i}" ${i === 5 ? "selected" : ""}>${pick(d)}</option>`).join("")}</select></div>
    <p class="label">${t("required")}</p>${["captain", "server", "busser", "bartender"].map(p => `<div class="kv"><span>${pick(POS[p])}</span><b>${p === "server" ? 2 : 1}</b></div>`).join("")}
    <button class="btn primary" data-create-event>${t("create")}</button>`;
}
function screenTeam() {
  return `<h1 class="h1">${t("team")}</h1><p class="cap muted">${t("stateLegend")}</p>
    <div>${PEOPLE.map(p => { const s = warningState(personWarnings(p.id), now); return `<div class="person"><span class="avatar">${p.initials}</span><span><b class="small">${esc(p.name)}</b><br><span class="cap muted">${pick(POS[p.pos])}${LADDER[p.pos] ? ` → ${pick(POS[LADDER[p.pos]])}` : ""}</span></span>${stateBadge(s)}</div>`; }).join("")}</div>
    <div class="card"><span class="label">${t("longestRun")}</span><div class="kv"><span>Ana L.</span></div><div class="kv"><span>Rachel K.</span></div><div class="kv"><span>Kenji M.</span></div></div>
    <button class="btn primary" data-sheet="issue">${t("logWarning")}</button>`;
}
function screenClose() {
  const openShort = state.shortages.filter(s => s.status !== "restocked"); const c = state.close;
  if (state.closed) return `<h1 class="h1">${t("close")}</h1><div class="locked">${ICON.lock}<p>${t("closed")}</p></div>
    <div class="card"><span class="label">${t("openItems")}</span><div class="kv"><span>${t("shortages")}</span>${openShort.length ? `<span class="badge b-att">${t("shortOpen")}</span>` : `<span class="badge b-ok">${t("shortNone")}</span>`}</div><div class="kv"><span>${t("attendance")}</span>${Object.values(c.late).some(Boolean) ? `<span class="badge b-att">${t("lateMarked")}</span>` : `<span class="badge b-ok">${ICON.check}</span>`}</div></div>`;
  const sideOpen = PEOPLE.reduce((a, p) => a + (progress(runFor(p)).n - progress(runFor(p)).d), 0);
  return `<h1 class="h1">${t("closeTitle")}</h1><p class="cap muted">${t("noMoney")}</p>
    <div class="row wrap">${sideOpen ? `<span class="badge b-att">${t("sideOpen")}</span>` : `<span class="badge b-ok">${t("sideAll")}</span>`}${openShort.length ? `<span class="badge b-att">${t("shortOpen")}</span>` : `<span class="badge b-ok">${t("shortNone")}</span>`}</div>
    <div class="field"><label for="cl-inc">${t("incidents")}</label><textarea id="cl-inc" data-close-field="incidents">${esc(c.incidents)}</textarea></div>
    <div class="card"><span class="label">${t("attendance")}</span>${["p2", "p6"].map(id => `<label class="kv"><span>${esc(person(id).name)}</span><input type="checkbox" data-late="${id}" ${c.late[id] ? "checked" : ""} style="width:24px;height:24px"></label>`).join("")}</div>
    <div class="field"><label>${t("cleaning")}</label><div class="seg"><button data-clean="ok" aria-pressed="${c.cleaning === "ok"}">${t("cleanOk")}</button><button data-clean="pending" aria-pressed="${c.cleaning === "pending"}">${t("cleanPending")}</button></div></div>
    <div class="card"><span class="label">${t("openItems")}</span>${openShort.map(s => `<div class="kv flag"><span>${esc(pick(BAR.find(b => b.id === s.item).name))}</span><b>${t(s.level)}</b></div>`).join("")}${state.eighty6.map(id => `<div class="kv"><span>86 · ${esc(pick(MENU.find(m => m.id === id).name))}</span></div>`).join("")}</div>
    <div class="field"><label for="cl-next">${t("nextShift")}</label><textarea id="cl-next" data-close-field="next">${esc(c.next)}</textarea></div>
    <button class="btn primary" data-submit-close>${t("submitClose")}</button>`;
}

/* ---------- director ---------- */
function venueState(v) {
  const reasons = [];
  if (v.close === "missing") reasons.push(t("r_closeMissing"));
  if (v.unconfirmed) reasons.push(t("r_unconfirmed"));
  if (v.short) reasons.push(t("r_shortage"));
  if (v.review) reasons.push(t("r_review"));
  const state_ = v.close === "missing" || v.review ? "actionRequired" : reasons.length ? "needsAttention" : "onTrack";
  return { state: state_, reasons: reasons.length ? reasons : [t("r_none")] };
}
function venues() {
  return [
    { id: 1, close: "done", unconfirmed: false, short: false, review: false },
    { id: 2, close: state.closed ? "done" : "open", unconfirmed: state.unconfirmed.length > 0, short: state.shortages.some(s => s.status !== "restocked"), review: PEOPLE.some(p => warningState(personWarnings(p.id), now) === "rev") },
    { id: 3, close: "missing", unconfirmed: true, short: true, review: false },
    { id: 4, close: "done", unconfirmed: false, short: false, review: false }
  ];
}
const STATE_CHIP = { onTrack: "b-ok", needsAttention: "b-att", actionRequired: "b-rev" };
function screenCompany() {
  return `<h1 class="h1">${t("company")}</h1><p class="small muted">${t("thisWeek")} · ${t("noMoney")}</p>
    ${venues().map(v => { const vs = venueState(v); return `<div class="card"><div class="row between"><b class="h2">${t("venue")} ${v.id}</b><span class="badge ${STATE_CHIP[vs.state]}">${vs.state === "onTrack" ? ICON.check : ICON.dot}${t(vs.state)}</span></div>
      <ul class="reasons">${vs.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>`; }).join("")}`;
}
function screenOrg() {
  const A = [["a_floor", ["polisher", "busser", "runner", "server", "captain"]], ["a_reception", ["host", L("Maître d'", "Maître d'")]], ["a_pass", ["expo"]],
    ["a_bar", ["barback", "bartender", L("Head bartender", "Head bartender"), L("Sommelier (optional)", "Sommelier (opcional)")]],
    ["a_kitchen", [L("Dishwasher", "Bachero"), L("Prep cook", "Ayudante de cocina"), L("Line cook", "Cocinero de línea"), L("Sous chef", "Sous chef"), L("Chef de cuisine", "Jefe de cocina")]],
    ["a_mgmt", [L("Floor manager", "Manager de turno"), L("Assistant GM", "Gerente adjunto"), L("General manager", "Gerente general")]], ["a_corp", ["director", "owner"]]];
  const nm = x => typeof x === "string" ? pick(POS[x]) : pick(x);
  return `<h1 class="h1">${t("org")}</h1>
    <div class="card" style="background:var(--olive-50);border-color:transparent"><span class="label">${t("chain")}</span><p class="small">${t("chainDown")}</p></div>
    <div class="chain">${A.map(([k, list]) => `<div class="area"><span class="label">${t(k)}</span><div class="lad">${list.map(nm).join(" → ")}</div></div>`).join("")}</div>`;
}

/* ---------- render ---------- */
const SCREENS = { today: screenToday, tasks: screenTasks, schedule: screenSchedule, section: screenSection, menu: screenMenu, rules: screenRules, me: screenMe, bar: screenBar, messages: screenMessages,
  floor: screenFloor, preshift: screenPreshift, shift: screenShift, team: screenTeam, close: screenClose, company: screenCompany, org: screenOrg };
const SHEETS = { request: sheetRequest, dish: sheetDish, msg: sheetMessage, compose: sheetCompose, warning: sheetWarning, propose: () => sheetPropose(false), issue: () => sheetPropose(true), event: sheetEvent };

function applyPrefs() { document.documentElement.lang = state.lang; document.documentElement.setAttribute("data-theme", state.theme); document.documentElement.style.setProperty("--scale", state.large ? "1.18" : "1"); }
function renderPanel() {
  $("#lbl-role").textContent = t("seeAs"); $("#lbl-lang").textContent = t("language"); $("#lbl-view").textContent = t("view");
  $("#roles").innerHTML = ROLES.map(r => `<button data-role="${r.key}" aria-pressed="${state.role === r.key}">${pick(POS[r.key])}<small>${r.person ? person(r.person).name : r.key === "manager" ? "Daniel B." : "Alex M."}</small></button>`).join("");
  $("#langs").innerHTML = `<button class="chipbtn" data-lang="en" aria-pressed="${state.lang === "en"}">English</button><button class="chipbtn" data-lang="es" aria-pressed="${state.lang === "es"}">Español</button>`;
  $("#views").innerHTML = `<button class="chipbtn" data-large aria-pressed="${state.large}">${t("largeText")}</button><button class="chipbtn" data-theme-set="${state.theme === "dark" ? "light" : "dark"}" aria-pressed="${state.theme === "dark"}">${t("dark")}</button>`;
  $("#demo-note").textContent = t("demoNote");
}
function render() {
  applyPrefs(); renderPanel();
  if (!role().tabs.includes(state.tab) && !(me() && EXTRA_TABS.includes(state.tab)) && !(state.tab === "messages")) state.tab = role().tabs[0];
  const m0 = $("main"); const scrollTop = m0 ? m0.scrollTop : 0; const focusId = document.activeElement && document.activeElement.id;
  let html = topbar() + mobileDemo() + `<main id="main">${SCREENS[state.tab]()}</main>` + tabsBar();
  if (me() && state.shift !== "closed" && !state.closed) html += `<button class="fab" data-sheet="request">${ICON.bell}${t("request")}</button>`;
  if (state.sheet) html += `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${SHEETS[state.sheet.kind](state.sheet.id)}</div></div>`;
  if (state.toast) html += `<div class="toast" role="status">${esc(state.toast)}</div>`;
  $("#app").innerHTML = html;
  if (state.sheet && (state.sheet.kind === "propose" || state.sheet.kind === "issue")) fillRules();
  const m = $("main"); if (m && state.keepScroll) m.scrollTop = scrollTop; state.keepScroll = false;
  if (focusId && document.getElementById(focusId)) { const el = document.getElementById(focusId); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
}
function toast(msg) { state.toast = msg; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { state.toast = null; render(); }, 2800); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-scrim]"); if (!b) return; const d = b.dataset;
  if (d.scrim !== undefined && e.target === b) { state.sheet = null; return render(); }
  if (d.role) { state.role = d.role; store.set("role12", d.role); state.tab = role().tabs[0]; state.sheet = null; return render(); }
  if (d.lang) { state.lang = d.lang; store.set("lang", d.lang); return render(); }
  if (d.large !== undefined) { state.large = !state.large; store.set("large", state.large); return render(); }
  if (d.largeSet !== undefined) { state.large = d.largeSet === "1"; store.set("large", state.large); return render(); }
  if (d.themeSet) { state.theme = d.themeSet; store.set("theme", d.themeSet); return render(); }
  if (d.tab) { state.tab = d.tab; state.sheet = null; return render(); }
  if (d.closeSheet !== undefined) { state.sheet = null; return render(); }
  if (d.sheet) { state.sheet = { kind: d.sheet }; return render(); }
  if (d.cat) { state.menuCat = d.cat; return render(); }
  if (d.dish) { state.sheet = { kind: "dish", id: d.dish }; return render(); }
  if (d.msg) { state.sheet = { kind: "msg", id: d.msg }; return render(); }
  if (d.openWarning) { state.sheet = { kind: "warning", id: d.openWarning }; return render(); }
  if (d.ackSched !== undefined) { state.schedAck[me().id] = true; state.unconfirmed = state.unconfirmed.filter(n => n !== me().name); state.keepScroll = true; return toast(`${t("confirmedAt")} · ${t("week")}`); }
  if (d.ackRules !== undefined) { state.rulesAck[me().id] = true; return toast(t("confirmed")); }
  if (d.ackMenu) { state.menuAck[d.ackMenu] = true; state.sheet = null; return toast(t("confirmed")); }
  if (d.check !== undefined) { const run = runFor(me()); const it = run.items[+d.check]; if (it.photo && !it.hasPhoto && !it.done) { it.hasPhoto = true; it.done = true; state.keepScroll = true; return toast(t("photoAdded")); } it.done = !it.done; state.keepScroll = true; return render(); }
  if (d.pickup !== undefined) { state.openShiftTaken = true; return toast(t("pickedUp")); }
  if (d.swap !== undefined) return toast(t("swapSent"));
  if (d.timeoff !== undefined) return toast(t("timeOffSent"));
  if (d.confirmMsg) { const m = state.messages.find(x => x.id === d.confirmMsg); m.confirmed = true; m.readBy++; return render(); }
  if (d.ack) { const w = state.warnings.find(x => x.id === d.ack); w.ack = true; const r = $("#w-resp").value.trim(); w.response = { en: r, es: r }; state.sheet = null; return toast(t("acknowledged")); }
  if (d.short) { const ex = state.shortages.find(s => s.item === d.short && s.status !== "restocked"); if (ex) ex.level = d.level; else state.shortages.unshift({ id: "s" + Date.now(), item: d.short, level: d.level, by: me() ? me().name : "Daniel B.", status: "open", at: Date.now() }); state.keepScroll = true; return toast(t("shortageSent")); }
  if (d.kind) { state.draft.kind = d.kind; return render(); }
  if (d.table) { state.draft.table = d.table; return render(); }
  if (d.sendRequest !== undefined) { const dr = state.draft; state.requests.unshift({ id: "q" + Date.now(), kind: dr.kind, by: me().name, table: dr.table, status: "open", at: Date.now() }); state.sheet = null; return toast(dr.kind === "help" ? t("helpSent") : t("sentTo")); }
  if (d.claim) { const q = state.requests.find(x => x.id === d.claim); q.status = "claimed"; q.claimedBy = me() ? me().name : "Daniel B."; state.keepScroll = true; return render(); }
  if (d.done) { state.requests.find(x => x.id === d.done).status = "done"; state.keepScroll = true; return render(); }
  if (d.sev) { b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (d.submitWarn) {
    const sev = $('[data-sev][aria-pressed="true"]').dataset.sev; const note = $("#wf-note").value.trim(); const rec = { personId: $("#wf-person").value, ruleId: $("#wf-rule").value, sev, note: { en: note, es: note } };
    state.sheet = null;
    if (d.submitWarn === "propose") { state.proposals.unshift({ id: "pr" + Date.now(), ...rec, by: me().name, status: "open" }); return toast(t("proposed")); }
    state.warnings.unshift({ id: "w" + Date.now(), ...rec, at: Date.now(), by: state.role === "director" ? "Alex M." : "Daniel B.", ack: false, response: { en: "", es: "" } }); return toast(t("issued"));
  }
  if (d.issue) { const x = state.proposals.find(y => y.id === d.issue); x.status = "issued"; state.warnings.unshift({ id: "w" + Date.now(), personId: x.personId, ruleId: x.ruleId, sev: x.sev, note: x.note, at: Date.now(), by: "Daniel B.", ack: false, response: { en: "", es: "" } }); state.keepScroll = true; return toast(t("issued")); }
  if (d.discard) { state.proposals.find(y => y.id === d.discard).status = "discarded"; state.keepScroll = true; return render(); }
  if (d.resolve) { state.shortages.find(s => s.id === d.resolve).status = d.v; state.keepScroll = true; return toast(t(d.v)); }
  if (d.addNote !== undefined) { const v = $("#pn").value.trim(); if (!v) return; state.preNotes.push({ en: v, es: v }); return toast(t("noteSaved")); }
  if (d["86"]) { const id = d["86"]; state.eighty6 = state.eighty6.includes(id) ? state.eighty6.filter(x => x !== id) : [...state.eighty6, id]; state.keepScroll = true; return state.eighty6.includes(id) ? toast(t("marked86")) : render(); }
  if (d.remind !== undefined) return toast(t("reminded"));
  if (d.approve) { state.approvals.find(a => a.id === d.approve).status = d.v; state.keepScroll = true; return render(); }
  if (d.publish !== undefined) { state.published2 = true; return toast(t("published")); }
  if (d.createEvent !== undefined) { const day_ = +$("#ev-day").value; state.events.push({ id: "ev" + Date.now(), name: { en: $("#ev-name").value, es: $("#ev-name").value }, day: day_, time: "6:00 PM", need: { captain: [1, 0], server: [2, 0], busser: [1, 0], bartender: [1, 0] } }); state.sheet = null; return toast(t("eventCreated")); }
  if (d.startClosing !== undefined) { state.shift = "closing"; return render(); }
  if (d.clean) { state.close.cleaning = d.clean; state.keepScroll = true; return render(); }
  if (d.submitClose !== undefined) { state.closed = true; state.shift = "closed"; return toast(t("closed")); }
  if (d.sendMsg !== undefined) { const ti = $("#c-title").value.trim(), bo = $("#c-body").value.trim(); if (!ti || !bo) return; state.messages.unshift({ id: "g" + Date.now(), from: state.role === "manager" ? "Daniel B." : "Alex M.", at: Date.now(), title: { en: ti, es: ti }, body: { en: bo, es: bo }, confirm: $("#c-confirm").checked, read: true, readBy: 0, total: 14 }); state.sheet = null; return toast(t("messageSent")); }
});
document.addEventListener("input", e => {
  if (e.target.id === "menu-q") { state.menuQ = e.target.value; state.keepScroll = true; return render(); }
  if (e.target.dataset.closeField) state.close[e.target.dataset.closeField] = e.target.value;
});
document.addEventListener("change", e => { if (e.target.id === "wf-person") fillRules(); if (e.target.dataset.late) state.close.late[e.target.dataset.late] = e.target.checked; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) { state.sheet = null; render(); } });
render();

</script>
