<title>The First</title>
<meta name="theme-color" content="#ffffff">
<style>
/*FONTS*/
/* Layout: phone-first app shell; on wide screens a phone frame with a demo panel beside it.
   Tokens mirror docs/brand/tokens.css. */
:root {
  --canvas: #ffffff; --surface: #f6f7f3; --raised: #ffffff; --line: #e3e6dc; --line-strong: #858a7f;
  --ink: #111311; --ink-muted: #5e625b; --ink-subtle: #6b6f68; --on-ink: #ffffff;
  --olive-50: #f3f5ec; --olive-100: #e8ecdc; --olive-200: #c9d1ae; --olive-300: #9aaa62;
  --brand: #5c6b2f; --brand-pressed: #4a5726; --on-brand: #ffffff; --focus: #2f5b8f;
  --ok-fg: #1f5f46; --ok-bg: #e3f1ea; --info-fg: #2f5b8f; --info-bg: #e5edf6;
  --att-fg: #7a4a04; --att-bg: #fef3c7; --fol-fg: #9a3b0b; --fol-bg: #fde8d7;
  --rev-fg: #912018; --rev-bg: #fee4e2; --danger: #b42318;
  --stage: #1a1d18; --stage-ink: #f2f3ee; --stage-muted: #a2a79a;
  --sans: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --scale: 1;
  --t-cap: calc(13px * var(--scale)); --t-small: calc(15px * var(--scale)); --t-body: calc(17px * var(--scale));
  --t-lead: calc(19px * var(--scale)); --t-title: calc(26px * var(--scale)); --t-fig: calc(34px * var(--scale));
  --r-check: 6px; --r-input: 10px; --r-ctl: 12px; --r-card: 16px; --r-sheet: 24px;
  --shadow-card: 0 1px 2px rgba(17,19,17,.06), 0 4px 12px rgba(17,19,17,.05);
  --shadow-sheet: 0 -8px 32px rgba(17,19,17,.12);
  --fast: 120ms; --slow: 320ms; --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0f110e; --surface: #171a15; --raised: #1d211b; --line: #2a2f26; --line-strong: #636a5d;
    --ink: #f2f3ee; --ink-muted: #b6bbae; --ink-subtle: #a2a79a; --on-ink: #111311;
    --olive-50: #1a1f12; --olive-100: #232a17; --brand: #9aaa62; --brand-pressed: #c9d1ae; --on-brand: #111311; --focus: #8fb4e3;
    --ok-fg: #8fd1b3; --ok-bg: #16281f; --info-fg: #9dbfe6; --info-bg: #15202d; --att-fg: #f5cf6b; --att-bg: #2b2208;
    --fol-fg: #f6a774; --fol-bg: #2e1709; --rev-fg: #f69c94; --rev-bg: #301110; --danger: #f69c94;
    --stage: #090a08; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0f110e; --surface: #171a15; --raised: #1d211b; --line: #2a2f26; --line-strong: #636a5d;
  --ink: #f2f3ee; --ink-muted: #b6bbae; --ink-subtle: #a2a79a; --on-ink: #111311;
  --olive-50: #1a1f12; --olive-100: #232a17; --brand: #9aaa62; --brand-pressed: #c9d1ae; --on-brand: #111311; --focus: #8fb4e3;
  --ok-fg: #8fd1b3; --ok-bg: #16281f; --info-fg: #9dbfe6; --info-bg: #15202d; --att-fg: #f5cf6b; --att-bg: #2b2208;
  --fol-fg: #f6a774; --fol-bg: #2e1709; --rev-fg: #f69c94; --rev-bg: #301110; --danger: #f69c94;
  --stage: #090a08; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--sans); font-size: var(--t-body); line-height: 1.5; }
button, a, [role="button"], .tap { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; font-size: max(16px, var(--t-body)); color: var(--ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }

/* Stage */
.stage { min-height: 100dvh; display: flex; gap: 40px; align-items: center; justify-content: center; padding-block: 24px; padding-inline: 16px; }
.panel { width: 320px; color: var(--stage-ink); display: flex; flex-direction: column; gap: 22px; }
.panel .brand { display: flex; align-items: center; gap: 14px; }
.panel .brand svg { width: 44px; height: 44px; }
.panel .brand b { display: block; font-size: 17px; letter-spacing: .16em; font-weight: 600; }
.panel .brand span { font-size: 11px; letter-spacing: .3em; color: var(--olive-200); font-weight: 500; }
.panel h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--stage-muted); text-transform: uppercase; margin-bottom: 8px; }
.panel p { font-size: 15px; color: var(--stage-muted); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.roles button { border: 1px solid #3a4034; border-radius: var(--r-ctl); padding: 12px; text-align: left; min-height: 56px; color: var(--stage-ink); }
.roles button small { display: block; color: var(--stage-muted); font-size: 12px; }
.roles button[aria-pressed="true"] { background: #5c6b2f; border-color: #5c6b2f; }
.roles button[aria-pressed="true"] small { color: #e8ecdc; }
.panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
.chipbtn { border: 1px solid #3a4034; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--stage-ink); min-height: 40px; }
.chipbtn[aria-pressed="true"] { background: var(--stage-ink); color: #111311; }
.demo-note { font-size: 13px; color: var(--stage-muted); border-top: 1px solid #2a2f26; padding-top: 14px; }
.phone { width: 400px; height: min(860px, calc(100dvh - 48px)); border-radius: 48px; background: #050605; padding: 12px; box-shadow: 0 40px 80px rgba(0,0,0,.45); flex: none; }
.app { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--canvas); display: flex; flex-direction: column; position: relative; }
@media (max-width: 860px) {
  .stage { padding: 0; display: block; }
  .panel { display: none; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
  .app { border-radius: 0; }
  .mobile-demo { display: flex !important; }
}

/* App chrome */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.topbar .mark { width: 30px; height: 30px; color: var(--brand); flex: none; }
.topbar .who { text-align: right; font-size: var(--t-cap); line-height: 1.3; min-width: 0; }
.topbar .who b { display: block; font-size: var(--t-small); font-weight: 600; }
.topbar .who span { color: var(--ink-muted); }
.mobile-demo { display: none; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.mobile-demo button { border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; min-height: 36px; }
.mobile-demo button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 18px 96px; display: flex; flex-direction: column; gap: 18px; }
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--canvas); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: var(--ink-muted); position: relative; border-radius: 10px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--brand); }
.tabs .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; padding: 0 5px; }

/* Type */
.h1 { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; }
.h2 { font-size: var(--t-lead); font-weight: 700; }
.muted { color: var(--ink-muted); }
.small { font-size: var(--t-small); }
.cap { font-size: var(--t-cap); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: var(--t-cap); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }

/* Controls */
.btn { min-height: 56px; border-radius: var(--r-ctl); padding: 0 20px; font-weight: 600; font-size: var(--t-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform var(--fast) var(--ease), background var(--fast); width: 100%; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:active { background: var(--brand-pressed); }
.btn.secondary { border: 1.5px solid var(--ink); color: var(--ink); }
.btn.quiet { min-height: 48px; color: var(--brand); width: auto; padding: 0 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--t-small); font-weight: 600; }
.field input, .field textarea, .field select { min-height: 52px; border: 1.5px solid var(--line-strong); border-radius: var(--r-input); background: var(--canvas); padding: 12px 14px; width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.field .hint { font-size: var(--t-cap); color: var(--ink-muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { min-height: 48px; font-weight: 600; font-size: var(--t-small); border-left: 1.5px solid var(--line-strong); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.search { min-height: 52px; border: 1.5px solid var(--line-strong); border-radius: var(--r-input); padding: 12px 14px 12px 44px; width: 100%; background: var(--canvas) no-repeat 14px center; }
.searchwrap { position: relative; }
.searchwrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-muted); }
.pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pill { border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 0 16px; min-height: 44px; font-weight: 600; font-size: var(--t-small); white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

/* Cards */
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.lift { box-shadow: var(--shadow-card); border-color: transparent; }
.card.brand { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.card.brand .muted { color: var(--olive-100); }
:root[data-theme="dark"] .card.brand .muted { color: #2e3618; }
.group { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item .grow { flex: 1; min-width: 0; }
.chev { width: 20px; height: 20px; color: var(--ink-subtle); flex: none; }

/* Progress and checklist */
.prog { height: 10px; border-radius: 999px; background: var(--olive-100); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width var(--slow) var(--ease); }
.check { width: 30px; height: 30px; border-radius: var(--r-check); border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; transition: background var(--fast), border-color var(--fast); }
.check svg { width: 18px; height: 18px; color: var(--on-brand); opacity: 0; transform: scale(.6); transition: opacity var(--fast), transform var(--fast) var(--ease); }
.done .check { background: var(--brand); border-color: var(--brand); }
.done .check svg { opacity: 1; transform: scale(1); }
.done .task-label { color: var(--ink-muted); }
.badge { font-size: var(--t-cap); font-weight: 600; border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.badge svg { width: 14px; height: 14px; }
.b-info { background: var(--info-bg); color: var(--info-fg); }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); }
.b-att { background: var(--att-bg); color: var(--att-fg); }
.b-fol { background: var(--fol-bg); color: var(--fol-fg); }
.b-rev { background: var(--rev-bg); color: var(--rev-fg); }
.b-neutral { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

/* Menu */
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dish { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.photo { aspect-ratio: 4 / 3; border-radius: 12px; background: var(--olive-50); display: grid; place-items: center; overflow: hidden; max-width: 100%; position: relative; }
.photo .plate { width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #ffffff 0 52%, #eceee6 53% 66%, #ffffff 67%); box-shadow: 0 6px 14px rgba(17,19,17,.12); display: grid; place-items: center; }
.photo .food { width: 46%; aspect-ratio: 1.4; border-radius: 48% 52% 44% 56%; transform: rotate(-12deg); }
.photo .glass { width: 34%; aspect-ratio: .6; border-radius: 8px 8px 40% 40%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
.photo .tagline { position: absolute; left: 8px; bottom: 8px; font-size: 11px; background: rgba(17,19,17,.62); color: #fff; padding: 2px 8px; border-radius: 6px; }
.dish b { font-size: var(--t-small); line-height: 1.3; }
.unavailable .photo { filter: grayscale(1); opacity: .6; }
.allergens { display: flex; gap: 6px; flex-wrap: wrap; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(17,19,17,.4); display: flex; align-items: flex-end; z-index: 20; animation: fade var(--fast) var(--ease); }
.sheet { background: var(--raised); width: 100%; max-height: 88%; overflow-y: auto; border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 14px; animation: rise var(--slow) var(--ease); overscroll-behavior: contain; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); align-self: center; margin-bottom: 4px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 92px; background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 14px 16px; font-weight: 600; font-size: var(--t-small); z-index: 30; animation: rise var(--slow) var(--ease); }
@keyframes rise { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Counts */
.count { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.stepper button { width: 52px; height: 52px; font-size: 24px; font-weight: 600; display: grid; place-items: center; }
.stepper output { min-width: 64px; text-align: center; font-family: var(--mono); font-size: var(--t-lead); font-variant-numeric: tabular-nums; }

/* KPI */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-family: var(--mono); font-size: var(--t-lead); font-variant-numeric: tabular-nums; font-weight: 600; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--t-small); }
.kv b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.flag b { color: var(--rev-fg); }
.person { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; min-height: 60px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--olive-100); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
:root[data-theme="dark"] .avatar { color: var(--olive-300); }
.mini { height: 6px; border-radius: 3px; background: var(--olive-100); overflow: hidden; margin-top: 6px; }
.mini i { display: block; height: 100%; background: var(--brand); }
.empty { text-align: center; padding: 28px 12px; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg { width: 36px; height: 36px; color: var(--olive-300); }
.venue { text-align: left; }
.locked { background: var(--surface); border-radius: var(--r-card); padding: 18px; display: flex; gap: 12px; align-items: flex-start; }
.locked svg { width: 24px; height: 24px; flex: none; color: var(--ink-muted); }
.fab { position: absolute; right: 16px; bottom: 84px; height: 56px; padding: 0 20px; border-radius: 28px; background: var(--brand); color: var(--on-brand); font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(17,19,17,.22); z-index: 10; }
.fab svg { width: 22px; height: 22px; }
.fab:active { background: var(--brand-pressed); transform: scale(.98); }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kind { border: 1.5px solid var(--line-strong); border-radius: var(--r-card); min-height: 76px; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; font-weight: 600; }
.kind svg { width: 24px; height: 24px; }
.kind[aria-pressed="true"] { border-color: var(--brand); background: var(--olive-50); box-shadow: inset 0 0 0 1.5px var(--brand); }
.kind.help { grid-column: span 2; border-color: var(--rev-fg); color: var(--rev-fg); flex-direction: row; align-items: center; min-height: 60px; gap: 10px; justify-content: flex-start; }
.kind.help[aria-pressed="true"] { background: var(--rev-bg); box-shadow: inset 0 0 0 1.5px var(--rev-fg); }
.tables { display: flex; gap: 8px; flex-wrap: wrap; }
.tbl { min-width: 52px; min-height: 48px; border: 1.5px solid var(--line-strong); border-radius: var(--r-ctl); font-family: var(--mono); font-weight: 600; }
.tbl[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.req { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.req .actions { display: flex; gap: 8px; }
.req .actions .btn { min-height: 48px; }
.btn.deny { border: 1.5px solid var(--danger); color: var(--danger); }
.toggle { width: 56px; height: 32px; border-radius: 16px; background: var(--line-strong); position: relative; flex: none; transition: background var(--fast); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform var(--fast) var(--ease); }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }
.lvl { font-family: var(--mono); font-weight: 600; font-size: 12px; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
</style>

<div class="stage">
  <aside class="panel" aria-label="Demo controls">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><!--MARK_WHITE--></svg>
      <div><b>THE FIRST</b><span>HOSPITALITY GROUP</span></div>
    </div>
    <div>
      <h2 id="lbl-role">See it as</h2>
      <div class="roles" id="roles" role="group" aria-labelledby="lbl-role"></div>
    </div>
    <div>
      <h2 id="lbl-lang">Language</h2>
      <div class="row" id="langs" role="group" aria-labelledby="lbl-lang"></div>
    </div>
    <div>
      <h2 id="lbl-view">View</h2>
      <div class="row" id="views" role="group" aria-labelledby="lbl-view"></div>
    </div>
    <p class="demo-note" id="demo-note"></p>
  </aside>

  <div class="phone">
    <div class="app" id="app" aria-live="polite"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- storage (per-viewer conveniences only) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("tfhg-proto-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tfhg-proto-" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- copy EN / ES ---------- */
const COPY = {
  en: {
    seeAs: "See it as", language: "Language", view: "View", largeText: "Large text", dark: "Dark", light: "Light",
    demoNote: "Prototype with demo data for Venue 2. Every action works and resets when you reload the page.",
    today: "Today", tasks: "Tasks", menu: "Menu", messages: "Messages", me: "Me", inventory: "Bar", shift: "Shift", team: "Team", close: "Close", venues: "Venues", settings: "Settings",

/* Pure rule, same as lib/domain/warnings.ts in the blueprint */
const THRESHOLDS = { windowDays: 30, attentionMinor: 1, followUpMinor: 3, followUpMajor: 1, reviewMajor: 2 };
function warningState(list, at, th = THRESHOLDS) {
  const live = list.filter(w => !w.voided && at - w.at <= th.windowDays * day);
  const minor = live.filter(w => w.sev === "minor").length;
  const major = live.filter(w => w.sev === "major").length;
  if (major >= th.reviewMajor) return "rev";
  if (major >= th.followUpMajor || minor >= th.followUpMinor) return "fol";
  if (minor >= th.attentionMinor) return "att";
  return "up";
}
const stateBadge = s => `<span class="badge b-${s === "up" ? "ok" : s}">${ICON[s === "up" ? "check" : s === "rev" ? "alert" : "dot"]}${t("state_" + s)}</span>`;
function personWarnings(id) { return state.warnings.filter(w => w.personId === id); }

function runFor(personId, role) {
  const tplRole = ["bartender", "barback"].includes(role) ? "bartender" : "server";
  const phase = state.shift === "open" ? "open" : "close";
  const key = personId + ":" + phase;
  if (!state.runs[key]) {
    const items = TEMPLATES[tplRole][phase];
    // demo progress for the rest of the team
    const seedDone = { p2: 4, p3: 6, p4: 2, p6: 2, p7: 6 }[personId] ?? (personId === "p1" ? 3 : personId === "p5" ? 1 : 0);
    state.runs[key] = { phase, items: items.map((it, i) => ({ label: Array.isArray(it) ? it[0] : it, photo: Array.isArray(it) ? it[1] : false, weekly: Array.isArray(it) ? !!it[2] : false, done: phase === "open" ? i < seedDone : false, hasPhoto: false })) };
  }
  return state.runs[key];
}
const progress = r => { const d = r.items.filter(i => i.done).length; return { d, n: r.items.length, pct: Math.round(100 * d / r.items.length) }; };

const MARK = `<!--MARK_BRAND-->`;

/* ---------- roles and tabs ---------- */
const ROLES = [
  { key: "server", person: "p1", tabs: ["today", "tasks", "menu", "messages", "me"] },
  { key: "bartender", person: "p5", tabs: ["today", "tasks", "inventory", "messages", "me"] },
  { key: "manager", person: null, tabs: ["shift", "requests", "team", "close", "messages"] },
  { key: "owner", person: null, tabs: ["venues", "pay", "messages"] }
];
const TAB_ICON = { requests: "bell", pay: "wallet", today: "home", tasks: "list", menu: "menu", messages: "chat", me: "user", inventory: "bottle", shift: "pulse", team: "team", close: "lock", venues: "grid" };
const role = () => ROLES.find(r => r.key === state.role);
const me = () => PEOPLE.find(p => p.id === role().person);

function unreadCount() { return state.messages.filter(m => !m.read).length; }
function pendingWarnings() { const p = me(); return p ? state.warnings.filter(w => w.personId === p.id && !w.ack) : []; }

/* ---------- screens ---------- */
function topbar() {
  const r = state.role;
  const name = r === "manager" ? "Daniel B." : r === "owner" ? "TFHG" : me().name;
  const sub = r === "owner" ? (state.lang === "es" ? "4 locales" : "4 venues") : `${t("venue")} 2 · ${t("dinner")}`;
  return `<header class="topbar"><svg class="mark" viewBox="0 0 64 64" role="img" aria-label="The First Hospitality Group">${MARK}</svg>
    <div class="who"><b>${esc(name)} · ${pick(ROLE_NAME[r])}${me() ? `<span class="lvl" title="${t("level")}">${me().level}</span>` : ""}</b><span>${sub}</span></div></header>`;
}
function mobileDemo() {
  return `<div class="mobile-demo" role="group" aria-label="${t("seeAs")}">${ROLES.map(r => `<button data-role="${r.key}" aria-pressed="${state.role === r.key}">${pick(ROLE_NAME[r.key])}</button>`).join("")}
  <button data-lang="${state.lang === "en" ? "es" : "en"}">${state.lang === "en" ? "ES" : "EN"}</button>
  <button data-large aria-pressed="${state.large}">${t("largeText")}</button></div>`;
}
function tabsBar() {
  return `<nav class="tabs" aria-label="Main">${role().tabs.map(k => {
    const pendReq = state.requests.filter(q => q.status === "pending").length;
    const dot = k === "messages" && unreadCount() ? `<span class="dot">${unreadCount()}</span>` : (k === "me" && pendingWarnings().length ? `<span class="dot">1</span>` : (k === "requests" && pendReq ? `<span class="dot">${pendReq}</span>` : ""));
    return `<button data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}>${ICON[TAB_ICON[k]]}<span>${t(k)}</span>${dot}</button>`;
  }).join("")}</nav>`;
}

function screenToday() {
  const p = me(); const run = runFor(p.id, p.role); const pr = progress(run);
  const next = run.items.find(i => !i.done);
  const pend = pendingWarnings();
  const unread = state.messages.filter(m => !m.read);
  let html = `<div class="stack"><p class="muted small">${t("goodEvening")}, ${esc(p.name.split(" ")[0])}</p>
    <h1 class="h1">${run.phase === "open" ? t("openingTasks") : t("closingTasks")}</h1>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pr.pct}"><i style="width:${pr.pct}%"></i></div>
    <p class="small muted">${pr.d} ${t("of")} ${pr.n} ${t("doneWord")}</p></div>`;
  if (state.shift === "closed") html += `<div class="locked">${ICON.lock}<p>${t("closed")}</p></div>`;
  else if (next) html += `<div class="card lift"><span class="label">${t("nextTask")}</span><p class="h2">${esc(pick(next.label))}</p>${next.photo ? `<span class="badge b-info">${ICON.camera}${t("photoRequired")}</span>` : ""}<button class="btn primary" data-tab="tasks">${t("nextTask")}</button></div>`;
  else html += `<div class="card"><p class="h2">${t("allDone")}</p></div>`;
  if (pend.length) html += `<button class="card venue" data-open-warning="${pend[0].id}" style="border-color:var(--att-fg)"><span class="badge b-att">${ICON.dot}${t("newNote")}</span><span class="row between"><span class="small">${t("openNote")}</span>${ICON.chev}</span></button>`;
  if (unread.length) html += `<button class="card venue" data-tab="messages"><span class="label">${t("messages")} · ${unread.length} ${t("unread")}</span><span class="h2">${esc(pick(unread[0].title))}</span><span class="small muted">${esc(unread[0].from)} · ${ago(unread[0].at)}</span></button>`;
  if (state.role === "server") html += `<div class="card"><div class="row between"><span class="label">${t("mySection")} ${SECTION.name}</span><span class="cap mono muted">${SECTION.tables[0]}–${SECTION.tables[SECTION.tables.length - 1]}</span></div>
    <span class="label" style="margin-top:4px">${t("tableNotes")}</span>${state.tableNotes.map(n => `<div class="kv"><span>${t("table")} ${n.table} · ${esc(pick(n.text))}</span>${n.kind === "allergy" ? `<span class="badge b-rev">${ICON.alert}${pick(ALLERGEN.shellfish)}</span>` : `<span class="badge b-info">${state.lang === "es" ? "Ocasión" : "Occasion"}</span>`}</div>`).join("")}</div>`;
  html += `<div class="card"><span class="label">${t("shiftNotes")}</span><p class="small">${t("lineup")}</p><p class="small muted">${t("tonightCovers")}</p></div>`;
  return html;
}

function screenTasks() {
  const p = me(); const run = runFor(p.id, p.role); const pr = progress(run);
  if (state.shift === "closed") return `<h1 class="h1">${t("tasks")}</h1><div class="locked">${ICON.lock}<p>${t("closed")}</p></div>`;
  return `<div class="stack"><h1 class="h1">${run.phase === "open" ? t("openingTasks") : t("closingTasks")}</h1>
    <div class="prog"><i style="width:${pr.pct}%"></i></div><p class="small muted">${pr.d} ${t("of")} ${pr.n} ${t("doneWord")}</p></div>
    <div class="group" role="list">${run.items.map((it, i) => `<button role="listitem" class="item ${it.done ? "done" : ""}" data-check="${i}" aria-pressed="${it.done}">
      <span class="check">${ICON.check}</span><span class="grow"><span class="task-label">${esc(pick(it.label))}</span>
      ${it.weekly ? `<br><span class="badge b-neutral" style="margin-top:6px">${t("weekly")}</span>` : ""}${it.photo ? ` <span class="badge ${it.hasPhoto ? "b-ok" : "b-info"}" style="margin-top:6px">${ICON.camera}${it.hasPhoto ? t("photoAdded") : t("photoRequired")}</span>` : ""}</span></button>`).join("")}</div>
    ${pr.d === pr.n ? `<div class="card"><p class="h2">${t("allDone")}</p></div>` : ""}`;
}

function photoArt(m) {
  return m.glass ? `<div class="photo"><div class="glass" style="background:${m.color}"></div></div>`
                 : `<div class="photo"><div class="plate"><div class="food" style="background:radial-gradient(circle at 35% 35%, ${m.color}, #2a1a12)"></div></div></div>`;
}
function screenMenu() {
  const cats = ["all", "starters", "mains", "desserts", "cocktails"];
  const q = state.menuQ.trim().toLowerCase();
  const list = MENU.filter(m => (state.menuCat === "all" || m.cat === state.menuCat) && (!q || (pick(m.name) + " " + pick(m.ing)).toLowerCase().includes(q)));
  return `<h1 class="h1">${t("menu")}</h1>
    <div class="searchwrap">${ICON.search}<input class="search" id="menu-q" type="search" placeholder="${t("search")}" aria-label="${t("search")}" value="${esc(state.menuQ)}" enterkeyhint="search"></div>
    <div class="pills" role="group" aria-label="${t("menu")}">${cats.map(c => `<button class="pill" data-cat="${c}" aria-pressed="${state.menuCat === c}">${t(c)}</button>`).join("")}</div>
    ${list.length ? `<div class="menu-grid">${list.map(m => `<button class="dish ${m.available ? "" : "unavailable"}" data-dish="${m.id}">${photoArt(m)}
      <b>${esc(pick(m.name))}</b>${m.available ? `<span class="allergens">${m.allergens.slice(0, 2).map(a => `<span class="badge b-rev">${pick(ALLERGEN[a])}</span>`).join("")}</span>` : `<span class="badge b-neutral">${t("unavailableToday")}</span>`}</button>`).join("")}</div>`
      : `<div class="empty">${ICON.search}<p>${t("noResults")}</p></div>`}`;
}
function sheetDish(id) {
  const m = MENU.find(x => x.id === id);
  return `<div class="grab"></div>${photoArt(m)}<div class="row between"><h2 class="h1" style="font-size:var(--t-lead)">${esc(pick(m.name))}</h2><span class="mono">${money(m.price)}</span></div>
    ${m.available ? "" : `<span class="badge b-neutral">${t("unavailableToday")}</span>`}
    <p>${esc(pick(m.desc))}</p>
    <div><p class="label">${t("allergens")}</p><div class="allergens" style="margin-top:8px">${m.allergens.length ? m.allergens.map(a => `<span class="badge b-rev">${ICON.alert}${pick(ALLERGEN[a])}</span>`).join("") : `<span class="badge b-ok">${ICON.check}${state.lang === "es" ? "Ninguno" : "None"}</span>`}</div></div>
    <div><p class="label">${t("ingredients")}</p><p class="small" style="margin-top:6px">${esc(pick(m.ing))}</p></div>
    <button class="btn secondary" data-close-sheet>${t("back")}</button>`;
}

function screenMessages() {
  const canSend = ["manager", "owner"].includes(state.role);
  return `<div class="row between"><h1 class="h1">${t("messages")}</h1></div>
    ${canSend ? `<button class="btn primary" data-sheet="compose">${t("sendMessage")}</button>` : ""}
    <div class="group">${state.messages.map(m => `<button class="item" data-msg="${m.id}"><span class="grow">
      <span class="row between"><b class="small">${esc(pick(m.title))}</b>${!m.read ? `<span class="badge b-info">${state.lang === "es" ? "Nuevo" : "New"}</span>` : ""}</span>
      <span class="cap muted">${esc(m.from)} · ${ago(m.at)}${canSend ? ` · ${t("readBy")} ${m.readBy}/${m.total}` : ""}</span></span>${ICON.chev}</button>`).join("")}</div>`;
}
function sheetMessage(id) {
  const m = state.messages.find(x => x.id === id); m.read = true;
  return `<div class="grab"></div><span class="label">${esc(m.from)} · ${ago(m.at)}</span><h2 class="h1" style="font-size:var(--t-lead)">${esc(pick(m.title))}</h2><p>${esc(pick(m.body))}</p>
    ${m.confirm && !["manager", "owner"].includes(state.role) ? (m.confirmed ? `<span class="badge b-ok">${ICON.check}${t("confirmed")}</span>` : `<p class="small muted">${t("requiresConfirm")}</p><button class="btn primary" data-confirm-msg="${m.id}">${t("readIt")}</button>`) : ""}
    ${["manager", "owner"].includes(state.role) ? `<div class="kv"><span>${t("readBy")}</span><b>${m.readBy}/${m.total}</b></div>` : ""}
    <button class="btn secondary" data-close-sheet>${t("back")}</button>`;
}
function sheetCompose() {
  return `<div class="grab"></div><h2 class="h1" style="font-size:var(--t-lead)">${t("sendMessage")}</h2>
    <div class="field"><label for="c-to">${t("to")}</label><select id="c-to"><option>${t("everyone")}</option><option>${pick(ROLE_NAME.server)}s</option><option>${pick(ROLE_NAME.bartender)}s</option></select></div>
    <div class="field"><label for="c-title">${t("title")}</label><input id="c-title" maxlength="80"></div>
    <div class="field"><label for="c-body">${t("message")}</label><textarea id="c-body" maxlength="600"></textarea></div>
    <label class="row small"><input type="checkbox" id="c-confirm" style="width:24px;height:24px"> ${t("requiresConfirm")}</label>
    <button class="btn primary" data-send-msg>${t("send")}</button>`;
}

function screenMe() {
  const p = me(); const list = personWarnings(p.id); const s = warningState(list, now);
  return `<h1 class="h1">${t("me")}</h1>
    <div class="card"><div class="row between"><span class="label">${t("myRecord")}</span>${stateBadge(s)}</div><p class="cap muted">${t("stateLegend")}</p>
    ${list.length ? `<div class="group">${list.map(w => { const r = RULES.find(x => x.id === w.ruleId); return `<button class="item" data-open-warning="${w.id}"><span class="grow"><b class="small">${esc(pick(r.title))}</b><br><span class="cap muted">${t(w.sev)} · ${ago(w.at)}</span></span>${w.ack ? `<span class="badge b-ok">${ICON.check}</span>` : `<span class="badge b-att">${state.lang === "es" ? "Nuevo" : "New"}</span>`}${ICON.chev}</button>`; }).join("")}</div>` : `<p class="small">${t("noWarnings")}</p>`}</div>
    <div class="card"><span class="label">${t("preferences")}</span>
      <div class="field"><label>${t("language")}</label><div class="seg"><button data-lang="en" aria-pressed="${state.lang === "en"}">English</button><button data-lang="es" aria-pressed="${state.lang === "es"}">Español</button></div></div>
      <div class="field"><label>${t("largeText")}</label><div class="seg"><button data-large-set="0" aria-pressed="${!state.large}">A</button><button data-large-set="1" aria-pressed="${state.large}" style="font-size:20px">A</button></div></div>
      <div class="field"><label>${t("view")}</label><div class="seg"><button data-theme-set="light" aria-pressed="${state.theme === "light"}">${t("light")}</button><button data-theme-set="dark" aria-pressed="${state.theme === "dark"}">${t("dark")}</button></div></div>
      <div class="kv"><span>${t("notifications")}</span><b>${t("on")}</b></div>
    </div>`;
}
function sheetWarning(id) {
  const w = state.warnings.find(x => x.id === id); const r = RULES.find(x => x.id === w.ruleId);
  const mine = me() && w.personId === me().id;
  return `<div class="grab"></div><div class="row between"><span class="label">${t(w.sev)} · ${ago(w.at)}</span><span class="cap muted">${t("logged")} ${esc(w.by)}</span></div>
    <div><p class="label">${t("rule")}</p><p class="h2" style="margin-top:4px">${esc(pick(r.title))}</p></div>
    ${pick(w.note) ? `<div><p class="label">${t("whatHappened")}</p><p class="small" style="margin-top:4px">${esc(pick(w.note))}</p></div>` : ""}
    <div class="card" style="background:var(--surface);border:0"><p class="label">${t("howToDoIt")}</p><p class="small">${esc(pick(r.how))}</p></div>
    ${mine && !w.ack ? `<div class="field"><label for="w-resp">${t("yourResponse")}</label><textarea id="w-resp" maxlength="500"></textarea></div><button class="btn primary" data-ack="${w.id}">${t("readIt")}</button>`
      : `<span class="badge b-ok">${ICON.check}${t("acknowledged")}</span>${pick(w.response) ? `<p class="small muted">"${esc(pick(w.response))}"</p>` : ""}`}
    <button class="btn secondary" data-close-sheet>${t("back")}</button>`;
}

function screenInventory() {
  const phase = state.shift === "open" ? "open" : "close";
  return `<h1 class="h1">${phase === "open" ? t("countOpening") : t("countClosing")}</h1>
    <p class="small muted">${state.lang === "es" ? "En décimas de botella" : "In tenths of a bottle"}</p>
    <div>${BAR.map(b => `<div class="count"><div><b class="small">${esc(b.name)}</b><br><span class="cap muted mono">${t("expected")} ${(phase === "open" ? b.open : b.open - b.used).toFixed(1)}</span></div>
      <div class="stepper" role="group" aria-label="${esc(b.name)}"><button data-step="${b.id}" data-d="-1" aria-label="-0.1">−</button><output>${(state.counts[b.id] / 10).toFixed(1)}</output><button data-step="${b.id}" data-d="1" aria-label="+0.1">+</button></div></div>`).join("")}</div>
    <button class="btn primary" data-save-count>${t("saveCount")}</button>
    ${state.countSaved ? `<span class="badge b-ok">${ICON.check}${t("countSaved")}</span>` : ""}`;
}

/* Manager */
function screenShift() {
  const team = PEOPLE.map(p => ({ p, pr: progress(runFor(p.id, p.role)) }));
  const lateIds = state.shift === "open" ? ["p4", "p6"] : [];
  const head = state.shift === "closed" ? `<div class="locked">${ICON.lock}<p>${t("closed")}</p></div>`
    : `<div class="card brand"><span class="label" style="color:inherit;opacity:.85">${state.shift === "open" ? t("shiftOpen") : t("startClosing")}</span><p class="h2">${t("tonightCovers")}</p></div>`;

  if (e.target.dataset.closeField) { state.close[e.target.dataset.closeField] = e.target.value; if (e.target.dataset.rerender !== undefined) { state.keepScroll = true; return render(); } const btn = $("[data-submit-close]"); if (btn) btn.disabled = !(state.close.covers !== "" && state.close.sales !== ""); }
});
document.addEventListener("change", e => { if (e.target.id === "wf-person") fillRules(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) { state.sheet = null; render(); } });
render();
</script>
